name: tfi-conocimiento-critico

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    ports:
      # Puerto de la máquina tomado del .env, para no chocar con un
      # PostgreSQL ya instalado. Dentro de Docker sigue siendo 5432.
      - "${DB_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # RustFS corre con el usuario 10001; este paso le da permisos sobre el
  # volumen antes de arrancar.
  storage-permisos:
    image: alpine:3
    volumes:
      - objdata:/data
    command: chown -R 10001:10001 /data
    restart: "no"

  storage:
    image: rustfs/rustfs:1.0.0-rc.6
    depends_on:
      storage-permisos:
        condition: service_completed_successfully
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: ${S3_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${S3_SECRET_KEY}
      # Entorno exclusivamente local, con un solo disco.
      RUSTFS_UNSAFE_BYPASS_DISK_CHECK: "true"
    ports:
      - "${S3_PORT:-9100}:9000" # API S3
      - "${S3_CONSOLE_PORT:-9101}:9001" # Consola web
    volumes:
      - objdata:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  backend:
    build: ./backend
    env_file: .env
    environment:
      # Dentro de Docker los servicios usan sus puertos internos.
      DB_HOST: db
      DB_PORT: 5432
      S3_ENDPOINT: http://storage:9000
      PORT: 3000
    ports:
      - "${PORT:-3000}:3000"
    volumes:
      - ./backend/src:/app/src
    depends_on:
      db:
        condition: service_healthy
      storage:
        condition: service_healthy

  frontend:
    build: ./frontend
    environment:
      API_URL: http://backend:3000
    ports:
      - "${FRONTEND_PORT:-5173}:5173"
    volumes:
      - ./frontend/src:/app/src
    depends_on:
      - backend

volumes:
  pgdata:
  objdata:
